<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illustrario — Galeria de arte com tema diário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="gallery-page">
        
        <section class="theme-banner">
            <p class="theme-label">Tema de hoje</p>
            <h1 class="theme-word" th:text="${theme.word}">floresta</h1>
            <p class="theme-hint" th:text="${theme.hint}">Inspire-se na natureza...</p>
            <a th:href="@{/gallery}" class="btn-submit" style="display:inline-block; margin-top:1rem; text-decoration:none;">
                🎨 Ver galeria e enviar arte
            </a>
        </section>

        <section class="gallery-section">
            <h2>Obras recentes</h2>

            <div th:if="${#lists.isEmpty(recentArtworks)}" class="empty-state">
                <p>Nenhuma obra enviada ainda. Seja o(a) primeiro(a)! 🎨</p>
            </div>

            <div class="artwork-grid" th:unless="${#lists.isEmpty(recentArtworks)}">
                <article class="artwork-card"
                         th:each="artwork : ${recentArtworks}"
                         th:unless="${artwork.removed}">
                    <div class="artwork-image-wrapper">
                        <img th:src="${artwork.filePath}"
                             th:alt="${artwork.title}"
                             class="artwork-image"
                             loading="lazy"/>
                    </div>
                    <div class="artwork-info">
                        <h3 th:text="${artwork.title}">Título</h3>
                        <p class="artwork-artist"
                           th:if="${artwork.artistName}"
                           th:text="'por ' + ${artwork.artistName}">por Artista</p>
                        <time class="artwork-date"
                              th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy HH:mm')}">
                        </time>
                    </div>
                </article>
            </div>
        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
