<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <title>Entrar - Illustrario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-auth">
    <h2>Entrar na sua conta</h2>

    <div class="auth-error" th:if="${param.error}">E-mail ou senha incorretos.</div>
    <div class="auth-success" th:if="${param.logout}">Logout realizado com sucesso.</div>

    <div class="auth-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
      <div class="auth-field">
        <label>Email:</label><br />
        <input class="form-input" type="email" name="username" required />
      </div>

      <div class="auth-field">
        <label>Senha:</label><br />
        <input class="form-input" type="password" name="password" required />
      </div>

      <button class="auth-submit" type="submit">Entrar</button>
      <p class="auth-footer">N&atilde;o tem conta? <a th:href="@{/register}">Cadastre-se</a></p>
    </form>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
