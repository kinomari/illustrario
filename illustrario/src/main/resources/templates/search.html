<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Busca: ' + ${query} + ' | Illustrario'">Buscar Artes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;">

        <h2>Resultados para: "<span th:text="${query}"></span>"</h2>

        <div th:if="${#lists.isEmpty(results)}" class="empty-state">
            <p>Nenhuma arte encontrada para "<strong th:text="${query}"></strong>". Tente outro termo.</p>
        </div>

        <div class="artwork-grid" th:unless="${#lists.isEmpty(results)}">
            <article class="artwork-card"
                     th:each="artwork : ${results}"
                     th:unless="${artwork.removed}">
                <div class="artwork-image-wrapper">
                    <img th:src="${artwork.filePath}"   th:alt="${artwork.title}"
                         class="artwork-image" loading="lazy"/>
                </div>
                <div class="artwork-info">
                    <h3 th:text="${artwork.title}">Título</h3>
                    <p class="artwork-artist"
                       th:if="${artwork.artistName}"
                       th:text="'por ' + ${artwork.artistName}">por Artista</p>
                    <p class="artwork-desc"
                       th:if="${artwork.description}"
                       th:text="${artwork.description}">Descrição</p>
                    <time class="artwork-date"
                          th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy')}">
                    </time>
                </div>
            </article>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
