<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${artwork.title} + ' | Illustrario'">Arte | Illustrario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="max-width: 900px; margin: 2rem auto; padding: 0 1.5rem;">

        <div style="text-align: center; margin-bottom: 2rem;">
            <img th:src="${artwork.filePath}"
                 th:alt="${artwork.title}"
                 style="max-width: 100%; max-height: 600px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        </div>

        <h1 th:text="${artwork.title}">Título</h1>
        <p th:if="${artwork.artistName}">
            por <strong th:text="${artwork.artistName}">Artista</strong>
        </p>
        <p th:if="${artwork.description}" th:text="${artwork.description}">Descrição</p>
        <p style="color: #aaa; font-size: 0.85rem;">
            Tema: <strong th:text="${artwork.theme}"></strong> ·
            <time th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy HH:mm')}"></time>
        </p>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <hr style="margin: 2rem 0;">

        <div style="margin-bottom: 2rem;">

            <span sec:authorize="isAuthenticated()">
                <button id="like-btn"
                        th:classappend="${hasLiked} ? ' liked' : ''"
                        th:data-id="${artwork.id}"
                        style="font-size: 1.4rem; cursor: pointer; border: none; background: none;">
                    ❤️
                </button>
                <span id="like-count" th:text="${likeCount}">0</span> curtidas
            </span>

            <span sec:authorize="!isAuthenticated()">
                ❤️ <span th:text="${likeCount}">0</span> curtidas ·
                <a th:href="@{/login}">Entre para curtir</a>
            </span>
        </div>

        <hr style="margin: 2rem 0;">

        <h3>Comentários (<span th:text="${#lists.size(comments)}">0</span>)</h3>

        <div th:if="${#lists.isEmpty(comments)}" style="color: #999; margin-bottom: 1rem;">
            Nenhum comentário ainda.
        </div>

        <div th:each="comment : ${comments}"
             th:unless="${comment.removed}"
             style="border-left: 3px solid #e8c4a0; padding: 0.8rem 1rem; margin-bottom: 1rem;">
            <strong th:text="${comment.authorName}">Autor</strong>
            <p th:text="${comment.content}" style="margin: 0.3rem 0;"></p>
            <small style="color: #aaa;"
                   th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
        </div>

        <div sec:authorize="isAuthenticated()" style="margin-top: 1.5rem;">
            <h4>Deixe seu comentário</h4>
            <form th:action="@{'/comments/' + ${artwork.id}}" method="post">
                <div class="form-group">
                    <textarea name="content" rows="3" class="form-input"
                              placeholder="O que você achou desta obra?"
                              required maxlength="500"></textarea>
                </div>
                <button type="submit" class="btn-submit">💬 Enviar comentário</button>
            </form>
        </div>

        <div sec:authorize="!isAuthenticated()" style="margin-top: 1.5rem; color: #888;">
            <a th:href="@{/login}">Entre na sua conta</a> para comentar.
        </div>

        <a href="/gallery" style="display: inline-block; margin-top: 2rem; color: #666;">← Voltar para a galeria</a>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script sec:authorize="isAuthenticated()">
        const btn = document.getElementById('like-btn');
        if (btn) {
            btn.addEventListener('click', async () => {
                const id = btn.dataset.id;
                const res = await fetch('/api/likes/' + id, { method: 'POST' });
                const data = await res.json();
                document.getElementById('like-count').textContent = data.count;
                btn.style.opacity = data.liked ? '1' : '0.4';
            });
        }
    </script>
</body>
</html>
