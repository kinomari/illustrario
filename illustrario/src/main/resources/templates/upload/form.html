<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Arte - Illustrario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="max-width: 700px; margin: 2rem auto; padding: 0 1rem;">

        <section class="theme-banner" style="border-radius: 12px; margin-bottom: 2rem;">
            <p class="theme-label">Tema de hoje</p>
            <h1 class="theme-word" th:text="${theme.word}">floresta</h1>
            <p class="theme-hint" th:text="${theme.hint}">Inspire-se...</p>
        </section>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <section class="upload-section">
            <h2>Envie sua arte</h2>

            <form th:action="@{/upload}"
                  th:object="${uploadDto}"
                  method="post"
                  enctype="multipart/form-data"
                  class="upload-form">

                <div class="form-group">
                    <label for="title">Título *</label>
                    <input type="text" id="title" th:field="*{title}"
                           placeholder="Dê um nome para sua obra"
                           class="form-input"/>
                    <span th:if="${#fields.hasErrors('title')}"
                          th:errors="*{title}" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="artistName">Seu nome</label>
                    <input type="text" id="artistName" th:field="*{artistName}"
                           placeholder="Como você quer ser chamado(a)?"
                           class="form-input"/>
                </div>

                <div class="form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" th:field="*{description}"
                              placeholder="Conte um pouco sobre sua arte..."
                              rows="3" class="form-input"></textarea>
                </div>

                <div class="form-group">
                    <label for="imageFile">Imagem * (JPG, PNG — máx. 5MB)</label>
                    <input type="file" id="imageFile" name="imageFile"
                           accept="image/jpeg,image/png"
                           class="form-input file-input" required/>
                    <img id="imagePreview" class="image-preview hidden" alt="Preview"/>
                </div>

                <button type="submit" class="btn-submit">🎨 Enviar obra</button>
            </form>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const preview = document.getElementById('imagePreview');
            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
