<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usu&aacute;rios | Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="sidebar-title">Painel</p>
      <a th:href="@{/admin}">Dashboard</a>
      <p class="sidebar-title">Conte&uacute;do</p>
      <a th:href="@{/admin/artworks}">Artes</a>
      <a th:href="@{/admin/comments}">Coment&aacute;rios</a>
      <p class="sidebar-title">Usu&aacute;rios</p>
      <a class="active" th:href="@{/admin/users}">Usu&aacute;rios</a>
    </aside>
    <main class="admin-content">
      <h2 class="admin-title">Usu&aacute;rios</h2>

      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>Avatar</th>
            <th>Apelido</th>
            <th>E-mail</th>
            <th>Role</th>
            <th class="admin-col-actions">A&ccedil;&otilde;es</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td>
              <img
                class="admin-user-avatar"
                th:if="${u.avatarPath}"
                th:src="${u.avatarPath}"
                th:alt="${u.nickname}"
              />
              <div
                class="admin-user-avatar-fallback"
                th:unless="${u.avatarPath}"
                th:text="${#strings.toUpperCase(#strings.substring(u.nickname,0,1))}"
              >
                A
              </div>
            </td>
            <td>
              <a class="admin-link-primary" th:href="@{'/perfil/' + ${u.nickname}}" th:text="${u.nickname}"></a>
            </td>
            <td class="admin-email-muted" th:text="${u.email}"></td>
            <td>
              <span class="badge badge-curator" th:if="${u.role == 'ROLE_CURATOR'}">Curador</span>
              <span class="badge badge-ok" th:unless="${u.role == 'ROLE_CURATOR'}">Usu&aacute;rio</span>
            </td>
            <td class="admin-actions admin-col-actions">
              <form
                th:if="${u.role != 'ROLE_CURATOR'}"
                th:action="@{'/admin/user/' + ${u.id} + '/promote'}"
                method="post"
              >
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn-sm btn-promote">Promover curador</button>
              </form>
              <form
                th:if="${u.role == 'ROLE_CURATOR'}"
                th:action="@{'/admin/user/' + ${u.id} + '/demote'}"
                method="post"
                onsubmit="return confirm('Revogar curadoria?')"
              >
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn-sm btn-hide">Revogar</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
