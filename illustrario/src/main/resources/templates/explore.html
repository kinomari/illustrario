<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar | Illustrario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main style="max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;">
        <h2>Explorar temas anteriores</h2>

        <div th:if="${#maps.isEmpty(themeArtworks)}" class="empty-state">
            <p>Nenhum tema anterior ainda. Volte amanhã!</p>
        </div>

        <div th:each="entry : ${themeArtworks}">
            <section style="margin-bottom: 3rem;">
                <div style="display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem;">
                    <h3 style="text-transform: uppercase; letter-spacing: 0.1em; margin: 0;"
                        th:text="${entry.key.word}">tema</h3>
                    <time style="color: #aaa; font-size: 0.85rem;"
                          th:text="${#temporals.format(entry.key.date, 'dd/MM/yyyy')}"></time>
                </div>

                <div th:if="${#lists.isEmpty(entry.value)}" style="color: #999;">
                    Nenhuma obra enviada para este tema.
                </div>

                <div class="artwork-grid" th:unless="${#lists.isEmpty(entry.value)}">
                    <article class="artwork-card" th:each="artwork : ${entry.value}">
                        <a th:href="@{'/gallery/artwork/' + ${artwork.id}}"
                           style="text-decoration: none; color: inherit;">
                            <div class="artwork-image-wrapper">
                                <img th:src="${artwork.filePath}"
                                     th:alt="${artwork.title}"
                                     class="artwork-image" loading="lazy"/>
                            </div>
                            <div class="artwork-info">
                                <h3 th:text="${artwork.title}">Título</h3>
                                <p class="artwork-artist"
                                   th:if="${artwork.artistName}"
                                   th:text="'por ' + ${artwork.artistName}"></p>
                            </div>
                        </a>
                    </article>
                </div>
            </section>
            <hr style="border: none; border-top: 1px solid #eee;">
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
