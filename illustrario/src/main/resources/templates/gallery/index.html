<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Galeria — ' + ${theme.word} + ' | Illustrario'">Galeria | Illustrario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="gallery-page">

        <section class="theme-banner">
            <p class="theme-label">Tema de hoje</p>
            <h1 class="theme-word" th:text="${theme.word}">floresta</h1>
            <p class="theme-hint" th:text="${theme.hint}">Inspire-se na natureza...</p>
        </section>

        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <section class="upload-section">
            <h2>Envie sua arte</h2>
            <form th:action="@{/gallery/upload}"
                  th:object="${uploadDto}"
                  method="post"
                  enctype="multipart/form-data"
                  class="upload-form">

                <div class="form-group">
                    <label for="title">Título *</label>
                    <input type="text" id="title" th:field="*{title}"
                           placeholder="Dê um nome para sua obra"
                           class="form-input"/>

                    <span th:if="${#fields.hasErrors('title')}"
                          th:errors="*{title}" class="field-error"></span>
                </div>

                <div class="form-group">
                    <label for="artistName">Seu nome</label>
                    <input type="text" id="artistName" th:field="*{artistName}"
                           placeholder="Como você quer ser chamado(a)?"
                           class="form-input"/>
                </div>

                <div class="form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" th:field="*{description}"
                              placeholder="Conte um pouco sobre sua arte..."
                              rows="3" class="form-input"></textarea>
                </div>

                <div class="form-group">
                    <label for="imageFile">Imagem * (JPG, PNG, WEBP — máx. 10MB)</label>
                    <input type="file" id="imageFile" name="imageFile"
                           accept="image/jpeg,image/png,image/webp,image/gif"
                           class="form-input file-input" required/>

                    <img id="imagePreview" class="image-preview hidden" alt="Preview"/>
                </div>

                <button type="submit" class="btn-submit">🎨 Enviar obra</button>
            </form>
        </section>

        <section class="gallery-section">
            <h2>Obras enviadas
                <span class="artwork-count"
                      th:text="'(' + ${#lists.size(artworks)} + ')'"></span>
            </h2>

            <div th:if="${#lists.isEmpty(artworks)}" class="empty-state">
                <p>Nenhuma obra enviada ainda. Seja o(a) primeiro(a)! 🎨</p>
            </div>

            <div class="artwork-grid" th:unless="${#lists.isEmpty(artworks)}">
                <article class="artwork-card" th:each="artwork : ${artworks}" th:unless="${artwork.removed}">
                    <div class="artwork-image-wrapper">
                        <img th:src="${artwork.filePath}"
                             th:alt="${artwork.title}"
                             class="artwork-image"
                             loading="lazy"/>
                    </div>
                    <div class="artwork-info">
                        <h3 th:text="${artwork.title}">Título</h3>
                        <p class="artwork-artist"
                           th:if="${artwork.artistName}"
                           th:text="'por ' + ${artwork.artistName}">por Artista</p>
                        <p class="artwork-desc"
                           th:if="${artwork.description}"
                           th:text="${artwork.description}">Descrição</p>
                        <time class="artwork-date"
                              th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy HH:mm')}">
                        </time>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>

        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const preview = document.getElementById('imagePreview');
            const reader = new FileReader();
            reader.onload = (event) => {
                preview.src = event.target.result;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
