<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Galeria — ' + ${theme.word} + ' | Illustrario'">Galeria | Illustrario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main style="max-width:1200px; margin:2rem auto; padding:0 1.5rem;">

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <h2 style="color:var(--vinho);">
            Galeria — <span th:text="${theme.word}">tema</span>
            <span style="font-weight:400; color:var(--subtext); font-size:1rem;"
                  th:text="'(' + ${#lists.size(artworks)} + ' obras)'"></span>
        </h2>

        <div th:if="${#lists.isEmpty(artworks)}" class="empty-state">
            Nenhuma obra enviada ainda para este tema. <a th:href="@{/upload}">Seja o primeiro!</a>
        </div>

        <div class="artwork-grid" th:unless="${#lists.isEmpty(artworks)}">
            <article class="artwork-card"
                     th:each="artwork : ${artworks}"
                     th:unless="${artwork.removed}">
                <a th:href="@{'/gallery/artwork/' + ${artwork.id}}" style="text-decoration:none; color:inherit;">
                    <div class="artwork-image-wrapper">
                        <img th:src="${artwork.filePath}" th:alt="${artwork.title}"
                             class="artwork-image" loading="lazy"/>
                    </div>
                    <div class="artwork-info">
                        <h3 th:text="${artwork.title}">Título</h3>
                        <p class="artwork-artist" th:if="${artwork.artistName}"
                           th:text="'por ' + ${artwork.artistName}"></p>
                        <time class="artwork-date"
                              th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy HH:mm')}"></time>
                    </div>
                </a>
            </article>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
