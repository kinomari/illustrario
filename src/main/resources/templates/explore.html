<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorar | Illustrario</title>
  <link rel="icon" type="image/png" th:href="@{/images/illustrario-favi.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-xl">
    <h2>Explorar temas anteriores</h2>

    <div class="empty-state" th:if="${#maps.isEmpty(themeArtworks)}">
      <p>Nenhum tema anterior ainda. Volte amanhã!</p>
    </div>

    <div th:each="entry : ${themeArtworks}">
      <section class="section-spaced">
        <div class="explore-theme-header">
          <h3 class="explore-theme-word" th:text="${entry.key.word}">tema</h3>
          <time class="explore-theme-date" th:text="${#temporals.format(entry.key.date, 'dd/MM/yyyy')}"></time>
        </div>

        <div class="explore-empty-theme" th:if="${#lists.isEmpty(entry.value)}">
          Nenhuma obra enviada para este tema.
        </div>

        <div class="artwork-grid" th:unless="${#lists.isEmpty(entry.value)}">
          <article class="artwork-card" th:each="artwork : ${entry.value}">
            <a class="card-link-block" th:href="@{'/gallery/artwork/' + ${artwork.id}}">
              <div class="artwork-image-wrapper">
                <img
                  class="artwork-image"
                  th:src="${artwork.thumbPath}"
                  th:alt="${artwork.title}"
                  loading="lazy"
                />
              </div>
              <div class="artwork-info">
                <h3 th:text="${artwork.title}">Título</h3>
                <p
                  class="artwork-artist"
                  th:if="${artwork.artistName}"
                  th:text="'por ' + ${artwork.artistName}"
                ></p>
              </div>
            </a>
          </article>
        </div>
      </section>
      <hr class="divider-subtle" />
    </div>

    <nav
      class="pagination"
      th:if="${themePage != null and themePage.totalPages > 1}"
      aria-label="Paginacao de temas anteriores"
    >
      <a
        class="pagination-link"
        th:classappend="${themePage.hasPrevious()} ? '' : ' disabled'"
        th:href="@{/explorar(page=${previousPage})}"
      >Anterior</a>

      <a
        class="pagination-link"
        th:each="pageNumber : ${#numbers.sequence(0, themePage.totalPages - 1)}"
        th:classappend="${pageNumber == currentPage} ? ' active' : ''"
        th:href="@{/explorar(page=${pageNumber})}"
        th:text="${pageNumber + 1}"
      >1</a>

      <a
        class="pagination-link"
        th:classappend="${themePage.hasNext()} ? '' : ' disabled'"
        th:href="@{/explorar(page=${nextPage})}"
      >Proxima</a>
    </nav>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
