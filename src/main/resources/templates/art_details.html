<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  lang="pt-BR"
>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${artwork.title} + ' | Illustrario'">Arte</title>
  <link rel="icon" type="image/png" th:href="@{/images/illustrario-favi.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <main class="art-details-main">
    <div class="art-details-media">
      <img class="art-details-image" th:src="${artwork.filePath}" th:alt="${artwork.title}" />

      <th:block th:if="${artwork.user != null}">
        <form
          class="art-delete-form"
          th:action="@{'/artwork/' + ${artwork.id} + '/delete'}"
          method="post"
          th:if="${artwork.user.email == #authentication.name or #authorization.expression('hasRole(''CURATOR'')')}"
          onsubmit="return confirm('Remover esta obra permanentemente?')"
        >
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn-delete btn-delete-overlay">🗑</button>
        </form>
      </th:block>
    </div>

    <h1 class="art-details-title" th:text="${artwork.title}"></h1>
    <p class="art-details-artist" th:if="${artwork.artistName}">
      por
      <a
        class="art-details-artist-link"
        th:href="@{'/perfil/' + ${artwork.artistName}}"
        th:text="${artwork.artistName}"
        >Artista</a
      >
    </p>
    <p class="art-details-description" th:if="${artwork.description}" th:text="${artwork.description}"></p>
    <p class="art-details-meta">
      Tema: <strong th:text="${artwork.theme}"></strong> ·
      <time th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy HH:mm')}"></time>
    </p>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <hr class="divider" />

    <div class="block-end-gap">
      <span sec:authorize="isAuthenticated()">
        <button
          id="like-btn"
          class="like-btn"
          th:classappend="${hasLiked} ? ' is-liked' : ''"
          th:data-id="${artwork.id}"
        >
          💖
        </button>
        <span id="like-count" th:text="${likeCount}">0</span> curtidas
      </span>
      <span sec:authorize="!isAuthenticated()">
        💖 <span th:text="${likeCount}">0</span> curtidas ·
        <a class="inline-link-accent-light" th:href="@{/login}">Entre para curtir</a>
      </span>
    </div>

    <hr class="divider" />

    <h3 class="comment-title">
      Comentários (<span th:text="${#lists.size(comments)}">0</span>)
    </h3>

    <div class="comment-empty" th:if="${#lists.isEmpty(comments)}">Nenhum comentário ainda.</div>

    <div class="comment-item" th:each="comment : ${comments}" th:unless="${comment.removed}">
      <a th:href="@{'/perfil/' + ${comment.authorName}}">
        <th:block th:with="author=${commentAuthors[comment.authorName]}">
          <img
            class="comment-avatar"
            th:if="${author != null and author.avatarPath != null}"
            th:src="${author.avatarPath}"
            th:alt="${comment.authorName}"
          />
          <div class="comment-avatar-placeholder" th:unless="${author != null and author.avatarPath != null}">
            <span th:text="${#strings.toUpperCase(#strings.substring(comment.authorName,0,1))}">A</span>
          </div>
        </th:block>
      </a>

      <div class="comment-body">
        <a
          class="comment-author"
          th:href="@{'/perfil/' + ${comment.authorName}}"
          th:text="${comment.authorName}"
          >Autor</a
        >
        <p class="comment-text" th:text="${comment.content}"></p>
        <span class="comment-date" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
      </div>

      <th:block sec:authorize="isAuthenticated()">
        <th:block
          th:with="author=${commentAuthors[comment.authorName]},
                                   isAuthor=${comment.authorName == currentNickname},
                                   isOwner=${artwork.user != null and artwork.user.email == #authentication.name}"
        >
          <form
            th:if="${isAuthor or isOwner}"
            th:action="@{'/comment/' + ${comment.id} + '/delete'}"
            method="post"
            onsubmit="return confirm('Remover este comentário?')"
          >
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-delete" title="Remover comentário">🗑</button>
          </form>
        </th:block>
      </th:block>
    </div>

    <div class="section-top-gap" sec:authorize="isAuthenticated()">
      <form th:action="@{'/comments/' + ${artwork.id}}" method="post">
        <div class="form-group">
          <textarea
            class="form-input"
            name="content"
            rows="3"
            placeholder="O que você achou desta obra?"
            required
            maxlength="500"
          ></textarea>
        </div>
        <button type="submit" class="btn-submit">💬 Comentar</button>
      </form>
    </div>

    <div class="comment-login-hint section-top-gap" sec:authorize="!isAuthenticated()">
      <a class="inline-link-accent-light" th:href="@{/login}">Entre</a> para comentar.
    </div>

    <a class="back-link" href="/">← Voltar</a>
  </main>
  <div th:replace="~{fragments/footer :: footer}"></div>

  <script sec:authorize="isAuthenticated()">
    const btn = document.getElementById("like-btn");
    if (btn)
      btn.addEventListener("click", async () => {
        const res = await fetch("/api/likes/" + btn.dataset.id, { method: "POST" });
        const data = await res.json();
        document.getElementById("like-count").textContent = data.count;
        btn.classList.toggle("is-liked", data.liked);
      });
  </script>
</body>
</html>
