<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil | Illustrario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-lg">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="profile-header">
      <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" id="avatarForm">
        <div class="avatar-wrapper">
          <img
            class="avatar-img"
            th:if="${user.avatarPath}"
            th:src="${user.avatarPath}"
            th:alt="${user.nickname}"
          />
          <div class="avatar-placeholder" th:unless="${user.avatarPath}">
            <span th:text="${#strings.toUpperCase(#strings.substring(user.nickname,0,1))}">A</span>
          </div>
          <button
            type="button"
            class="avatar-upload-btn"
            onclick="document.getElementById('avatarFile').click()"
            title="Trocar avatar"
          >
            &#9999;&#65039;
          </button>
        </div>
        <input
          class="input-hidden"
          type="file"
          id="avatarFile"
          name="avatarFile"
          accept="image/jpeg,image/png,image/webp"
          onchange="document.getElementById('avatarForm').submit()"
        />
      </form>

      <div>
        <h2 class="profile-info-title" th:text="${user.nickname}">Apelido</h2>
        <p class="profile-info-email" th:text="${user.email}">email</p>
        <p class="profile-info-meta">
          <span th:text="${#lists.size(artworks)}">0</span> obra(s) enviada(s)
        </p>
      </div>
    </div>

    <h3 class="profile-section-title">Minhas obras</h3>

    <div class="empty-state" th:if="${#lists.isEmpty(artworks)}">
      Voc&ecirc; ainda n&atilde;o enviou nenhuma obra.
      <a class="profile-empty-link" th:href="@{/upload}">Envie a primeira!</a>
    </div>

    <div class="artwork-grid" th:unless="${#lists.isEmpty(artworks)}">
      <div class="artwork-card-wrapper" th:each="artwork : ${artworks}">
        <article class="artwork-card">
          <a class="card-link-block" th:href="@{'/gallery/artwork/' + ${artwork.id}}">
            <div class="artwork-image-wrapper">
              <img
                class="artwork-image"
                th:src="${artwork.thumbPath}"
                th:alt="${artwork.title}"
                loading="lazy"
              />
            </div>
            <div class="artwork-info">
              <h3 th:text="${artwork.title}">Título</h3>
              <p class="artwork-meta">
                Tema: <span th:text="${artwork.theme}"></span> &middot;
                <time th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy')}"></time>
              </p>
            </div>
          </a>
        </article>

        <form
          th:action="@{'/artwork/' + ${artwork.id} + '/delete'}"
          method="post"
          onsubmit="return confirm('Remover esta obra permanentemente?')"
        >
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn-delete-artwork" title="Remover obra">&#128465;</button>
        </form>
      </div>
    </div>
  </main>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
