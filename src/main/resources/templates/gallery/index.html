<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="'Galeria - ' + ${theme.word} + ' | Illustrario'">Galeria | Illustrario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <main class="page-container-xl">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <h2 class="page-title-with-meta">
      Galeria - <span th:text="${theme.word}">tema</span>
      <span class="page-title-meta" th:text="'(' + ${#lists.size(artworks)} + ' obras)'"></span>
    </h2>

    <div class="empty-state" th:if="${#lists.isEmpty(artworks)}">
      Nenhuma obra enviada ainda para este tema. <a th:href="@{/upload}">Seja o primeiro!</a>
    </div>

    <div class="artwork-grid" th:unless="${#lists.isEmpty(artworks)}">
      <article
        class="artwork-card"
        th:each="artwork : ${artworks}"
        th:unless="${artwork.removed}"
      >
        <a class="card-link-block" th:href="@{'/gallery/artwork/' + ${artwork.id}}">
          <div class="artwork-image-wrapper">
            <img
              class="artwork-image"
              th:src="${artwork.thumbPath}"
              th:alt="${artwork.title}"
              loading="lazy"
            />
          </div>
          <div class="artwork-info">
            <h3 th:text="${artwork.title}">T&iacute;tulo</h3>
            <p
              class="artwork-artist"
              th:if="${artwork.artistName}"
              th:text="'por ' + ${artwork.artistName}"
            ></p>
            <time class="artwork-date" th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy HH:mm')}"></time>
          </div>
        </a>
      </article>
    </div>
  </main>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
