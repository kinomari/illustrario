<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illustrario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main>
    <section class="hero">
      <p class="hero-text">
        Cada dia uma palavra.<br />Cada artista, uma visão diferente.
        <br /><br />
        <a class="inline-link-accent" th:href="@{/sobre}">Saiba mais &rarr;</a>
      </p>
      <div class="hero-divider"></div>
      <div class="hero-theme">
        <p class="theme-label">Tema de hoje</p>
        <h1 class="theme-word">
          <a class="theme-word-link" th:href="@{/gallery}" th:text="${theme.word}">tema</a>
        </h1>
        <p class="theme-hint" th:text="${theme.hint}"></p>
      </div>
    </section>

    <div class="home-empty" th:if="${#lists.isEmpty(recentArtworks)}">
      Nenhuma obra enviada ainda.
      <a class="home-empty-link" th:href="@{/upload}">Seja o primeiro!</a>
    </div>

    <div
      class="masonry-wall home-masonry-wall"
      th:unless="${#lists.isEmpty(recentArtworks)}"
      id="homeMasonryWall"
    >
      <div
        class="gallery home-masonry-track"
        id="homeMasonryTrack"
        th:attr="data-next-page=${recentArtworksNextPage},data-page-size=${recentArtworksPageSize},data-has-more=${recentArtworksHasMore}"
      >
        <a
          class="masonry-card masonry-item"
          th:each="a : ${recentArtworks}"
          th:href="@{'/artwork/' + ${a.id}}"
        >
          <img class="home-masonry-image" th:src="${a.thumbPath}" th:alt="${a.title}" loading="lazy" />

          <div class="masonry-overlay">
            <p class="mo-title" th:text="${a.title}"></p>
            <p class="mo-meta" th:if="${a.artistName}" th:text="'por ' + ${a.artistName}"></p>
          </div>
        </a>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script th:src="@{/js/home-masonry.js}"></script>
</body>
</html>
