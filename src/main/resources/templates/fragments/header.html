<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head></head>
<body>
  <header th:fragment="header">
    <nav class="navbar">
      <div class="nav-left">
        <div class="logo">
          <a href="/">
            <img
              src="/images/illustrario-logo.png"
              alt="Illustrario"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'"
            />
            <span class="logo-text-fallback">Illustrario</span>
          </a>
        </div>
        <div class="menu">
          <a class="nav-link" href="/">Início</a>
          <a class="nav-link" href="/explorar">Explorar</a>
          <a class="nav-link" href="/sobre">Sobre</a>
          <a class="nav-link" href="/upload" sec:authorize="isAuthenticated()">Enviar Arte</a>
          <a class="nav-link" href="/profile" sec:authorize="isAuthenticated()">Perfil</a>
          <a
            class="nav-link nav-link-admin"
            href="/admin"
            sec:authorize="hasRole('CURATOR')"
            >Admin</a
          >
        </div>
      </div>

      <div class="nav-right">
        <form class="search-box" th:action="@{/search}" method="get">
          <input type="text" name="q" placeholder="Buscar artes..." />
        </form>

        <span class="nav-auth-links" sec:authorize="!isAuthenticated()">
          <a class="nav-link" href="/login">Entrar</a>
          <a class="nav-link" href="/register">Cadastrar</a>
        </span>

        <span class="nav-user-area" sec:authorize="isAuthenticated()">
          <a class="nav-user-profile" href="/profile">
            <img
              class="avatar"
              th:if="${currentAvatarPath != null}"
              th:src="${currentAvatarPath}"
              alt="avatar"
            />

            <div
              class="avatar-fallback"
              th:unless="${currentAvatarPath != null}"
              th:text="${currentNickname != null} ? ${#strings.toUpperCase(#strings.substring(currentNickname,0,1))} : '?'"
            ></div>

            <span
              class="nav-link nav-user-name"
              th:text="${currentNickname != null ? currentNickname : #authentication.name}"
            ></span>
          </a>

          <a class="logout-btn" href="/logout">Sair</a>
        </span>
      </div>
    </nav>
  </header>
</body>
</html>
