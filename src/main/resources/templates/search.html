<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="'Busca: ' + ${query} + ' | Illustrario'">Buscar</title>
  <link rel="icon" type="image/png" th:href="@{/images/illustrario-favi.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-xl">
    <h2 class="page-title-with-meta">
      Resultados para "<span th:text="${query}"></span>"
      <span class="page-title-meta" th:text="'(' + ${#lists.size(results)} + ')'"></span>
    </h2>

    <div class="empty-state" th:if="${#lists.isEmpty(results)}">
      Nenhuma arte encontrada. Tente outro termo.
    </div>

    <div class="artwork-grid" th:unless="${#lists.isEmpty(results)}">
      <article
        class="artwork-card"
        th:each="artwork : ${results}"
        th:unless="${artwork.removed}"
      >
        <a class="card-link-block" th:href="@{'gallery/artwork/' + ${artwork.id}}">
          <div class="artwork-image-wrapper">
            <img
              class="artwork-image"
              th:src="${artwork.thumbPath}"
              th:alt="${artwork.title}"
              loading="lazy"
            />
          </div>
          <div class="artwork-info">
            <h3 th:text="${artwork.title}">Título</h3>
            <p
              class="artwork-artist"
              th:if="${artwork.artistName}"
              th:text="'por ' + ${artwork.artistName}"
            ></p>
            <p
              class="artwork-desc"
              th:if="${artwork.description}"
              th:text="${artwork.description}"
            ></p>
            <time class="artwork-date" th:text="${#temporals.format(artwork.uploadedAt, 'dd/MM/yyyy')}"></time>
          </div>
        </a>
      </article>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
