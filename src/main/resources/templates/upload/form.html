<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar Arte | Illustrario</title>
  <link rel="icon" type="image/png" th:href="@{/images/illustrario-favi.png}">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-sm">
    <div class="upload-theme-block">
      <p class="theme-label">Tema de hoje</p>
      <h2 class="upload-theme-word" th:text="${theme.word}">tema</h2>
      <p class="upload-theme-hint" th:text="${theme.hint}"></p>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="upload-section">
      <h2>Envie sua arte</h2>

      <form
        class="upload-form"
        th:action="@{/upload}"
        th:object="${uploadDto}"
        method="post"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="title">Título *</label>
          <input
            class="form-input"
            type="text"
            id="title"
            th:field="*{title}"
            placeholder="Dê um nome para sua obra"
          />
          <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>

        <div class="form-group">
          <label for="description">Descrição</label>
          <textarea
            class="form-input"
            id="description"
            th:field="*{description}"
            placeholder="Conte um pouco sobre sua arte..."
            rows="3"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="imageFile">Imagem * (JPG, PNG, max 5MB)</label>
          <input
            class="form-input"
            type="file"
            id="imageFile"
            name="imageFile"
            accept="image/jpeg,image/png"
            required
          />
          <img id="imagePreview" class="image-preview hidden" alt="Preview" />
        </div>

        <button type="submit" class="btn-submit">Enviar obra</button>
      </form>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    document.getElementById("imageFile").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const preview = document.getElementById("imagePreview");
      const reader = new FileReader();
      reader.onload = (event) => {
        preview.src = event.target.result;
        preview.classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
