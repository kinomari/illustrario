<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Illustrario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-auth">
    <h2>Crie sua conta</h2>

    <div class="auth-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/register}" th:object="${userForm}" method="post">
      <div class="form-group">
        <label>Apelido</label>
        <input
          class="form-input"
          type="text"
          th:field="*{nickname}"
          placeholder="Como você quer ser conhecido(a)?"
        />
        <span class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></span>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input class="form-input" type="email" th:field="*{email}" placeholder="seu@email.com" />
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
      </div>

      <div class="form-group">
        <label class="auth-label-inline">Senha <small>(mín. 6 caracteres)</small></label>
        <input class="form-input" type="password" th:field="*{password}" />
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      </div>

      <button type="submit" class="btn-submit">Criar conta</button>
      <p class="auth-footer">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </form>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
