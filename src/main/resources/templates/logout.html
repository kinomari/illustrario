<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <title>Sair - Illustrario</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="page-container-auth">
    <h2>Deseja sair da sua conta?</h2>

    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="auth-submit" type="submit">Confirmar logout</button>
      <p class="auth-footer"><a th:href="@{/profile}">Cancelar e voltar ao perfil</a></p>
    </form>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
