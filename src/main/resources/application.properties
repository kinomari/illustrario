# ============================================================
#  UPLOAD DE IMAGENS
# ============================================================

app.upload.dir=uploads/artworks

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.allowed-extensions=jpg,jpeg,png